services:
  bili4k:
    build:
      context: .
    image: bili4k-service:1.0.0
    container_name: bili4k-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 凭证持久化，容器重建后仍可复用扫码登录结果
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      BILI4K_DATA_DIR: /data
      BILI4K_DEFAULT_QN: "120"
      BILI4K_CORS_ORIGINS: "*"
      # 反向代理或端口映射后，建议显式指定后端对外地址：
      # BILI4K_PUBLIC_BASE_URL: "http://192.168.1.10:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3).getcode()==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
